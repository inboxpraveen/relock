name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: relock
          POSTGRES_PASSWORD: relock
          POSTGRES_DB: relock
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relock"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RELOCK_TEST_POSTGRES_URL: postgresql://relock:relock@localhost:5432/relock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: pytest
      - name: examples
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/examples/01_quickstart.py"
          python "$GITHUB_WORKSPACE/examples/02_llm_rewriter.py"
          python "$GITHUB_WORKSPACE/examples/03_langgraph_callbacks.py"
      - name: structural benchmark reproduces the published tables
        if: matrix.python == '3.13'
        run: |
          relock bench --out "$RUNNER_TEMP/bench"
          diff docs/results/structural.md "$RUNNER_TEMP/bench/structural.md"

  mcp-1x:
    name: mcp 1.x compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" "mcp>=1.2,<2"
      - run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - run: pytest tests/test_integrations.py -k mcp

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: core install has no runtime dependencies
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install dist/*.whl
          test "$(/tmp/core/bin/pip list --format=freeze | grep -vc '^pip==')" = "1"
          cd /tmp && /tmp/core/bin/python -c "import relock_memory as r; print(r.__version__)"

  clients:
    name: clients (curl, TypeScript, Rust) against relock serve
    runs-on: ubuntu-latest
    env:
      RELOCK_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install .
      - name: start three servers
        run: |
          for port in 8801 8802 8803; do
            nohup relock --db "$RUNNER_TEMP/$port.db" serve --port $port > "$RUNNER_TEMP/$port.log" 2>&1 &
          done
          for port in 8801 8802 8803; do
            for i in $(seq 30); do curl -fsS "http://127.0.0.1:$port/v1/health" && break; sleep 1; done
          done
      - name: curl
        run: |
          RELOCK_URL=http://127.0.0.1:8801 sh examples/http/curl.sh | tee out.txt
          grep -q "attempt 3: confirmed" out.txt
      - name: TypeScript
        working-directory: examples/http/typescript
        run: |
          RELOCK_URL=http://127.0.0.1:8802 node demo.ts | tee out.txt
          grep -q "attempt 3: get_orders(2026-03-14) ok -> confirmed" out.txt
      - name: Rust
        working-directory: examples/http/rust
        run: |
          RELOCK_URL=http://127.0.0.1:8803 cargo run -q | tee out.txt
          grep -q "attempt 3: get_orders(2026-03-14) ok -> confirmed" out.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t relock:ci .
      - name: refuses to start publicly without a token
        run: |
          set +e
          timeout 30 docker run --rm relock:ci
          code=$?
          test "$code" = "2" || { echo "expected exit 2 (refused), got $code"; exit 1; }
      - name: serves the API with a token
        run: |
          docker run -d --name relock -p 8765:8765 -e RELOCK_TOKEN=ci-token relock:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8765/v1/health && break; sleep 1; done
          RELOCK_TOKEN=ci-token sh examples/http/curl.sh | tee out.txt
          grep -q "attempt 3: confirmed" out.txt
          docker exec relock relock --version
