[build-system]
requires = ["hatchling>=1.24", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "relock-memory"
version = "0.3.1"
description = "Agent memory that fixes the rule that fired, in place and only on trusted evidence, so corrected mistakes don't come back. Python, HTTP (any language), MCP."
dynamic = ["readme"]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Praveen Kumar" }]
keywords = [
  "agents", "llm", "memory", "agent-memory", "reconsolidation",
  "procedural-memory", "self-improving", "mcp", "langchain", "langgraph",
  "tool-calling", "openapi", "prompt-injection",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
# The core has no runtime dependencies: SQLite storage, BM25 retrieval and the
# OpenAI-compatible client are all standard library.
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mcp = ["mcp>=1.2"]
langchain = ["langchain-core>=0.3"]
all = ["psycopg[binary]>=3.1", "mcp>=1.2", "langchain-core>=0.3"]
dev = ["pytest>=8", "ruff>=0.6", "psycopg[binary]>=3.1", "mcp>=1.2", "langchain-core>=0.3"]

[project.scripts]
relock = "relock_memory.cli:main"

[project.urls]
Homepage = "https://github.com/inboxpraveen/relock"
Repository = "https://github.com/inboxpraveen/relock"
Issues = "https://github.com/inboxpraveen/relock/issues"
Changelog = "https://github.com/inboxpraveen/relock/blob/main/CHANGELOG.md"

# PyPI renders the README without GitHub's relative links, heading anchors or Mermaid, so the
# copy that goes into the package metadata points those at GitHub instead.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/inboxpraveen/relock/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/inboxpraveen/relock/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/inboxpraveen/relock/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#([^)\s]+)\)'
replacement = '](https://github.com/inboxpraveen/relock#\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://)([^)\s]+)\)'
replacement = '](https://github.com/inboxpraveen/relock/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/relock_memory"]

[tool.hatch.build.targets.sdist]
include = ["src/relock_memory", "tests", "examples", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "postgres: needs a Postgres server (set RELOCK_TEST_POSTGRES_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012", "SIM105", "B008", "B905", "SIM905"]
