<title id="t">RelapseBench (structural): what reaches the agent&#x27;s memory context</title><desc id="d">Same feedback stream for every system: drift correction, flaky timeouts, a prompt injection, a noisy failure. 120 probes per system, all load levels pooled.</desc>
