<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" role="img" aria-labelledby="title desc">
<title id="title">The lifecycle of a memory in relock</title>
<desc id="desc">A memory is locked until it is recalled in a task, which makes it editable. Each outcome passes a trust gate. Untrusted or transient outcomes are logged and never applied. Trusted errors add evidence; at the threshold the clause that fired is rewritten in place and the old version is superseded. When the task ends the memory re-locks, and the next recall sees only the new version.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 10 5 0 10z"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-muted" d="M0 0 10 5 0 10z"/></marker>
</defs>
<style>
:root{--surface:#ffffff;--panel:#f7f8fa;--line:#e2e4e8;--ink:#191919;--ink2:#666666;--muted:#9a9a9a;--accent:#257de0;--accent-tint:rgba(37,125,224,.08)}
@media (prefers-color-scheme: dark){:root{--surface:#191919;--panel:#202124;--line:#36383d;--ink:#efefef;--ink2:#9c9c9c;--muted:#6f6f6f;--accent:#338ced;--accent-tint:rgba(51,140,237,.15)}}
text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.bg{fill:var(--surface)} .node{fill:var(--panel);stroke:var(--line)} .key{fill:var(--accent-tint);stroke:var(--accent)}
.off{fill:none;stroke:var(--muted);stroke-dasharray:4 4}
.title{fill:var(--ink);font-size:17px;font-weight:650} .sub{fill:var(--ink2);font-size:12.5px}
.nt{fill:var(--ink);font-size:14px;font-weight:650} .nta{fill:var(--accent);font-size:14px;font-weight:700}
.ns{fill:var(--ink2);font-size:12px} .el{fill:var(--ink2);font-size:11.5px} .ml{fill:var(--muted);font-size:12px}
.head{fill:var(--accent)} .head-muted{fill:var(--muted)}
.flow{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:5 5;animation:flow 1.2s linear infinite}
.branch{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 4}
@keyframes flow{to{stroke-dashoffset:-10}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
</style>

<rect class="bg" x="0" y="0" width="880" height="312" rx="10"/>
<text class="title" x="24" y="34">The lifecycle of a memory</text>
<text class="sub" x="24" y="56">Only a recalled memory can change, only on trusted evidence, and it re-locks when the task ends.</text>

<!-- top row -->
<rect class="node" x="24.5" y="80.5" width="165" height="59" rx="10"/>
<text class="nt" x="42" y="105">Locked</text>
<text class="ns" x="42" y="125">stored, read-only</text>

<rect class="node" x="246.5" y="80.5" width="165" height="59" rx="10"/>
<text class="nt" x="264" y="105">Editable</text>
<text class="ns" x="264" y="125">recalled in this task</text>

<rect class="key" x="468.5" y="80.5" width="165" height="59" rx="10"/>
<text class="nta" x="486" y="105">Trust gate</text>
<text class="ns" x="486" y="125">trusted, not transient?</text>

<rect class="node" x="690.5" y="80.5" width="165" height="59" rx="10"/>
<text class="nt" x="708" y="105">Evidence</text>
<text class="ns" x="708" y="125">rewrite at 2 errors</text>

<!-- branch: untrusted or transient -->
<path class="branch" d="M551 141V165" marker-end="url(#arrow-muted)"/>
<rect class="off" x="468.5" y="168.5" width="165" height="45" rx="8"/>
<text class="ml" x="551" y="187" text-anchor="middle">untrusted or transient:</text>
<text class="el" x="551" y="204" text-anchor="middle">logged, never applied</text>

<!-- bottom: rewrite -->
<rect class="key" x="690.5" y="232.5" width="165" height="59" rx="10"/>
<text class="nta" x="708" y="257">Rewritten in place</text>
<text class="ns" x="708" y="277">v1 superseded, kept</text>

<!-- the cycle -->
<path class="flow" d="M191 110H243" marker-end="url(#arrow)"/>
<text class="el" x="217" y="101" text-anchor="middle">recall</text>
<path class="flow" d="M413 110H465" marker-end="url(#arrow)"/>
<text class="el" x="439" y="101" text-anchor="middle">outcome</text>
<path class="flow" d="M635 110H687" marker-end="url(#arrow)"/>
<text class="el" x="661" y="101" text-anchor="middle">trusted</text>
<path class="flow" d="M773 141V229" marker-end="url(#arrow)"/>
<text class="el" x="781" y="190">threshold reached</text>
<path class="flow" d="M689 262H107V143" marker-end="url(#arrow)"/>
<text class="el" x="398" y="254" text-anchor="middle">task ends: re-lock. The next recall sees only v2.</text>
</svg>
